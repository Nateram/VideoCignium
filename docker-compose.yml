services:
  video-analysis-app:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Montar directorio de uploads para persistir videos subidos
      - ./static/uploads:/app/static/uploads
      # Montar logs para persistir archivos de log
      - ./logs:/app/logs
      # Montar configuración ROI si existe
      - ../timestamp_roi_config.json:/app/timestamp_roi_config.json:ro
    env_file:
      - .env
    environment:
      - FLASK_APP=${FLASK_APP:-app.py}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-5000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
